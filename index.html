<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML5 Form Practice</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="form-container">
        <h2>Create an Account</h2>
        <p>Please fill out this form to practice HTML5 validation and styling.</p>
        
        <form id="practiceForm" novalidate>
            <fieldset>
                <legend>Account Details</legend>
                
                <div class="form-group">
                    <label for="username">Username <span class="required">*</span></label>
                    <input type="text" id="username" name="username" required minlength="3" maxlength="15" placeholder="e.g., janesmith">
                    <span class="error-message" id="usernameError"></span>
                </div>

                <div class="form-group">
                    <label for="email">Email Address <span class="required">*</span></label>
                    <input type="email" id="email" name="email" required placeholder="e.g., jane@example.com">
                    <span class="error-message" id="emailError"></span>
                </div>

                <div class="form-group">
                    <label for="password">Password <span class="required">*</span></label>
                    <input type="password" id="password" name="password" required minlength="8" placeholder="At least 8 characters">
                    <span class="error-message" id="passwordError"></span>
                </div>
            </fieldset>

            <fieldset>
                <legend>Personal Profile</legend>

                <div class="form-group">
                    <label for="birthdate">Date of Birth <span class="required">*</span></label>
                    <input type="date" id="birthdate" name="birthdate" required>
                    <span class="error-message" id="birthdateError"></span>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" placeholder="123-456-7890" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}">
                    <small class="form-hint">Format: 123-456-7890</small>
                    <span class="error-message" id="phoneError"></span>
                </div>

                <div class="form-group">
                    <label for="website">Personal Website / Portfolio</label>
                    <input type="url" id="website" name="website" placeholder="https://example.com">
                    <span class="error-message" id="websiteError"></span>
                </div>

                <div class="form-group">
                    <label for="experience">Skill Level (HTML/CSS): <span id="rangeValue">5</span>/10</label>
                    <input type="range" id="experience" name="experience" min="1" max="10" value="5">
                </div>
            </fieldset>

            <div class="form-group checkbox-group">
                <input type="checkbox" id="terms" name="terms" required>
                <label for="terms">I agree to the terms and conditions <span class="required">*</span></label>
                <span class="error-message" id="termsError"></span>
            </div>

            <button type="submit" id="submitBtn">Register</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
